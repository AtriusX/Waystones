[versions]
kotlin = "2.3.0"
koin = "4.2.1"
arrow = "2.1.2"
flyway = "11.10.5"
sqlite = "3.50.3.0"
mysql = "9.4.0"
bstats = "3.1.0"
detekt = "2.0.0-alpha.2"
shadow = "9.4.1"
minecraft-server = "4.0.2"
koin-compiler = "1.0.0-RC1"
hangar = "0.1.3"
modrinth = "2.8.7"
buildconfig = "5.6.7"
mockk = "1.14.2"
kotest = "5.9.1"
mockbukkit = "4.113.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version = "26.1.2.build.+" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
detekt-ktlint = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
minecraft-server = { id = "dev.s7a.gradle.minecraft.server", version.ref = "minecraft-server" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compiler" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
hangar = { id = "io.papermc.hangar-publish-plugin", version.ref = "hangar" }
modrinth = { id = "com.modrinth.minotaur", version.ref = "modrinth" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
